
[package]
name = "migrator_service"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "migrator_service"
path = "./app/main.rs"



[dependencies]
dotenvy = "0.15.7"
tracing = "0.1.41"
tracing-subscriber = "0.3.20"
anyhow = "1.0.100"
mysql = "26.0.1"
serde_yaml = "0.9.34"
serde = { version = "1.0.228", features = ["derive"] }
opentelemetry = "0.31.0"
opentelemetry_sdk = { version = "0.31.0", features = ["experimental_metrics_custom_reader", "metrics"] }
opentelemetry-otlp = { version = "0.31.0", features = ["http-json"] }
tracing-opentelemetry = "0.32.0"
tokio = { version = "1.48.0", features = ["macros", "rt", "rt-multi-thread"] }
strum_macros = "0.27.2"
