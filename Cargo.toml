
[package]
name = "migrator_service"
version = "0.1.0"
edition = "2024"

[features]
default = []
telemetry = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:tracing-opentelemetry",
    "dep:tokio",
]

[[bin]]
name = "migrator_service"
path = "./app/main.rs"



[dependencies]
dotenvy = "0.15.7"
tracing = "0.1.41"
tracing-subscriber = "0.3.20"
anyhow = "1.0.100"
mysql = { version = "26.0.1", default-features = false, features = ["minimal-rust", "rustls-tls"] }
opentelemetry = { version = "0.31.0", optional = true }
opentelemetry_sdk = { version = "0.31.0", features = ["experimental_metrics_custom_reader", "metrics"], optional = true }
opentelemetry-otlp = { version = "0.31.0", features = ["http-json"], optional = true }
tracing-opentelemetry = { version = "0.32.0", optional = true }
tokio = { version = "1.48.0", features = ["macros", "rt", "rt-multi-thread"], optional = true }
strum_macros = "0.27.2"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
panic = "abort"
