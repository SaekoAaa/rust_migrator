services:
  db_migrator:
    build:
      context: .
      target: final
    container_name: migrator

    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_USER: "${MYSQL_USER}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD}"
      MYSQL_PORT: 3306
      MYSQL_ADDRESS: "mysql"
      MYSQL_DATABASE: "app_db"
      MIGRATIONS_PATH: /migrations
      COLLECTOR_URL: "http://otel:4318/v1"
      WITH_TRACING: "true"
      WITH_METRICS: "true"
    volumes:
      - ./migrations:/migrations
    # secrets:
    #   - db_user
    #   - db_password
  mysql:
    container_name: mysql
    image: mysql:latest
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
      MYSQL_DATABASE: "app_db"
      MYSQL_USER: "${MYSQL_USER}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD}"
    expose:
      - 3306
    ports:
      - "3306:3306"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -p$(cat /run/secrets/db_password) --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 3s
  otel-collector:
    container_name: otel
    image: otel/opentelemetry-collector-contrib
    command: --config=/etc/otelcol/config.yaml
    ports:
      - "4318:4318" # HTTP
    #      - "9464:9464"  # Prometheus scrape endpoint
    volumes:
      - ./config/otel_collector.yaml:/etc/otelcol/config.yaml:ro
  jaeger:
    image: jaegertracing/jaeger:latest
    container_name: jaeger
    ports:
      - "16686:16686" # Web UI http://localhost:16686
      - "14268:14268"
    expose:
      - "14268"
      - "4317"
      - "4318"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      LOG_LEVEL: debug
  prom:
    image: prom/prometheus
    ports:
      - "9099:9090"
    command: --config.file=/etc/prometheus/prometheus.yaml
    volumes:
      - ./config/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
